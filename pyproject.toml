[project]
name = "roseau-load-flow-tutorials"
version = "0.1.0"
description = "Tutorials for Roseau Load Flow inspired from different software"
requires-python = ">=3.13"
license = "MIT"
authors = [
  { name = "Roseau Technologies", email = "contact@roseautechnologies.com" },
]
maintainers = [
  { name = "Roseau Technologies", email = "contact@roseautechnologies.com" },
]
urls.repository = "https://github.com/RoseauTechnologies/Roseau_Load_Flow_Tutorials/"
dependencies = [
  "dss-python>=0.15.7",
  "jupyter>=1.0.0",
  "rich>=13.8.0",
  "roseau-load-flow>=0.15.0",
]

# Ruff
[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
  "C90",
  "B",
  "UP",
  "I",
  "RUF100",
  "TID",
  "SIM",
  "PT",
  "PIE",
  "N",
  "C4",
  "NPY",
  "T10",
]
unfixable = ["B"]
ignore = ["B024", "N818"]
flake8-tidy-imports.ban-relative-imports = "all"
flake8-pytest-style.parametrize-values-type = "tuple"
mccabe.max-complexity = 15

# Rumdl
[tool.rumdl.global]
line-length = 120
flavor = "gfm"

[tool.rumdl.per-file-ignores]
"OpenDSS/Tutorial_1/README.md" = ["MD033"]
"OpenDSS/Tutorial_2/README.md" = ["MD033"]

# Tombi
[tool.tombi.files]
exclude = ["uv.lock"]

[[tool.tombi.schemas]]
root = "tool.typos"
path = "https://raw.githubusercontent.com/crate-ci/typos/refs/heads/master/config.schema.json"
include = ["pyproject.toml"]

[[tool.tombi.schemas]]
root = "tool.rumdl"
path = "https://raw.githubusercontent.com/rvben/rumdl/main/rumdl.schema.json"
include = ["pyproject.toml"]

# Typos
[tool.typos.default.extend-words]
# Neutral power
pn = "pn"
